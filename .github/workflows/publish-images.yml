name: Publish Images

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:  
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
  
    steps:
      - name: Check out tested commit 
        uses: actions/checkout@v4
        with: 
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io 
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish api 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/syss69/fuel-map-api:${{ github.event.workflow_run.head_sha }}

      - name: Build and publish web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/syss69/fuel-map-web:${{ github.event.workflow_run.head_sha }}

  start_staging:
    name: Start EC2
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authentificate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::421247849651:role/trajetico-github-staging-control #${{ vars.AWS_STAGING_CONTROL_ROLE_ARN }}
          aws-region: eu-north-1
          allowed-account-ids: "421247849651"

      - name: Start staging instance
        env:
          STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
        run: |
          aws ec2 start-instances --instance-ids "$STAGING_INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$STAGING_INSTANCE_ID"

  deploy_staging:
    name: deploy to staging server
    needs: start_staging
    runs-on: ubuntu-latest

    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env: 
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }} 
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Wait for staging SSH over Tailscale
        env:
          STAGING_HOST: ${{ vars.STAGING_TAILSCALE_IP }}
        run: |
          for attempt in {1..30}; do
            if ssh \
              -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              trajetico@"$STAGING_HOST" "true"; then
              echo "Staging SSH is ready."
              exit 0
            fi

            echo "Attempt ${attempt}/30 failed; retrying in 10 seconds..."
            sleep 10
          done

          echo "Staging SSH did not become available in time."
          exit 1

      - name: Pull and start tested images on staging server
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          STAGING_HOST: ${{ vars.STAGING_TAILSCALE_IP }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            trajetico@"$STAGING_HOST" \
            "cd /home/trajetico/apps/fuel_map && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml pull api web && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml up -d --wait postgres && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml run --rm api node packages/database/dist/src/migrate.js && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml up -d --no-build api web && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml ps"
  
      - name: Wait for staging API readiness
        env:
          STAGING_HOST: ${{ vars.STAGING_TAILSCALE_IP }}
        run: |
          for attempt in {1..12}; do
            if ssh \
              -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              trajetico@"$STAGING_HOST" \
              "cd /home/trajetico/apps/fuel_map && \
               docker compose -f docker-compose.staging.yml exec -T api \
               node -e 'fetch(\"http://127.0.0.1:3000/ready\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'"; then
              echo "Staging API is ready."
              exit 0
            fi

            echo "Attempt ${attempt}/12 failed; retrying in 5 seconds..."
            sleep 5
          done

          echo "Staging API did not become available in time."
          exit 1

  deploy_production:
    name: Deploy to production server
    needs: deploy_staging
    runs-on: ubuntu-latest
    environment:
      name: production

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env: 
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }} 
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and start tested images
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          PROD_HOST: ${{ vars.PROD_HOST }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            trajetico@"$PROD_HOST" \
            "cd /home/trajetico/trajetico/fuel_map && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.production.yml pull api web && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.production.yml run --rm api node packages/database/dist/src/migrate.js && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.production.yml up -d --no-build api web && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.production.yml ps"
            
      - name: Wait for public website
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://trajetico.com/ > /dev/null; then
              echo "Website is available."
              exit 0
            fi

            echo "Attempt ${attempt}/12 failed; retrying in 5 seconds..."
            sleep 5
          done

          echo "Website did not become available in time."
          exit 1

  stop_staging:
    name: Stop staging EC2
    needs: [start_staging, deploy_staging, deploy_production]
    if: ${{ always() && needs.start_staging.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authentificate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::421247849651:role/trajetico-github-staging-control #${{ vars.AWS_STAGING_CONTROL_ROLE_ARN }}
          aws-region: eu-north-1
          allowed-account-ids: "421247849651"
        
      - name: Stop staging instance
        env:
          STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
        run: |
          aws ec2 stop-instances --instance-ids "$STAGING_INSTANCE_ID"
          aws ec2 wait instance-stopped --instance-ids "$STAGING_INSTANCE_ID"