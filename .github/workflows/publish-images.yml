name: Publish Images

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:  
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
  
    steps:
      - name: Check out tested commit 
        uses: actions/checkout@v4
        with: 
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io 
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish api 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/syss69/fuel-map-api:${{ github.event.workflow_run.head_sha }}

      - name: Build and publish web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/syss69/fuel-map-web:${{ github.event.workflow_run.head_sha }}

  deploy:
    name: Deploy to production server
    needs: publish
    runs-on: ubuntu-latest

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env: 
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }} 
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and start tested images
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          PROD_HOST: ${{ vars.PROD_HOST }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            trajetico@"$PROD_HOST" \
            "cd /home/trajetico/trajetico/fuel_map && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.production.yml pull api web && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.production.yml run --rm api node packages/database/dist/src/migrate.js && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.production.yml up -d --no-build api web && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.production.yml ps"
      - name: Check public website
        run: curl --fail --silent --show-error --max-time 15 https://trajetico.com/ > /dev/null