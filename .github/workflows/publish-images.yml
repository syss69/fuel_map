name: Publish Images

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:  
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
  
    steps:
      - name: Check out tested commit 
        uses: actions/checkout@v4
        with: 
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io 
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish api 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/syss69/fuel-map-api:${{ github.event.workflow_run.head_sha }}

      - name: Build and publish web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/syss69/fuel-map-web:${{ github.event.workflow_run.head_sha }}

  deploy_staging:
    name: deploy to staging server
    needs: publish
    runs-on: ubuntu-latest

    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env: 
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }} 
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Pull and start tested images on staging server
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          STAGING_HOST: ${{ vars.STAGING_TAILSCALE_IP }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            trajetico@"$STAGING_HOST" \
            "cd /home/trajetico/apps/fuel_map && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml pull api web && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml up -d --wait postgres && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml run --rm api node packages/database/dist/src/migrate.js && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml up -d --no-build api web && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.staging.yml ps"
  
      - name: Wait for staging 
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://dev.trajetico.com/ > /dev/null; then
              echo "Staging website is available."
              exit 0
            fi

            echo "Attempt ${attempt}/12 failed; retrying in 5 seconds..."
            sleep 5
          done

          echo "Staging website did not become available in time."
          exit 1

